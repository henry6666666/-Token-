<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>🔥 Token 焚烧炉</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .container { text-align: center; z-index: 2; }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    background: linear-gradient(90deg, #ff6b00, #ff0044, #ff6b00);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 2s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% center; } }

  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
    margin: 2rem 0;
    min-width: 420px;
  }
  .stat {
    background: #14141f;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 1rem 1.5rem;
  }
  .stat .label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 1px; }
  .stat .value { font-size: 2rem; font-weight: bold; margin-top: 0.3rem; }
  .tokens { color: #ff6b00; }
  .cost { color: #ff0044; }
  .calls { color: #00d4ff; }
  .rate { color: #00ff88; }

  .controls { display: flex; gap: 1rem; margin-top: 1rem; }
  button {
    background: #1a1a2a;
    color: #e0e0e0;
    border: 1px solid #3a3a4a;
    padding: 0.9rem 2rem;
    font-size: 1rem;
    font-family: inherit;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover { background: #2a2a3a; border-color: #ff6b00; }
  button.active {
    background: linear-gradient(135deg, #ff6b00, #ff0044);
    border-color: transparent;
    color: white;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  .log {
    margin-top: 1.5rem;
    width: 600px;
    height: 120px;
    overflow-y: auto;
    background: #0f0f18;
    border: 1px solid #2a2a3a;
    border-radius: 8px;
    padding: 0.8rem;
    font-size: 0.75rem;
    color: #888;
    text-align: left;
  }
  .log div { margin-bottom: 2px; }
  .log .ok { color: #00ff88; }
  .log .err { color: #ff0044; }

  /* 火焰背景 */
  .fire {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 40vh;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 100%, rgba(255,107,0,0.3), transparent 70%);
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 1;
  }
  .fire.on { opacity: 1; animation: flicker 0.3s infinite alternate; }
  @keyframes flicker { from { opacity: 0.7; } to { opacity: 1; } }

  .warning {
    margin-top: 1rem;
    font-size: 0.75rem;
    color: #ff6b00;
    max-width: 500px;
  }
</style>
</head>
<body>

<div class="fire" id="fire"></div>

<div class="container">
  <h1>🔥 TOKEN 焚烧炉 🔥</h1>
  <p style="color:#666;font-size:0.85rem">激活后疯狂请求，实时烧钱</p>

  <div class="stats">
    <div class="stat">
      <div class="label">已烧 Tokens</div>
      <div class="value tokens" id="tokens">0</div>
    </div>
    <div class="stat">
      <div class="label">预估花费 (USD)</div>
      <div class="value cost" id="cost">$0.0000</div>
    </div>
    <div class="stat">
      <div class="label">API 调用次数</div>
      <div class="value calls" id="calls">0</div>
    </div>
    <div class="stat">
      <div class="label">Token/秒</div>
      <div class="value rate" id="rate">0</div>
    </div>
  </div>

  <div class="controls">
    <button id="toggle">▶ 激活焚烧</button>
    <button id="reset">↺ 重置</button>
  </div>

  <div class="log" id="log"></div>

  <p class="warning">
    ⚠️ 本页面会真实调用 API 并产生费用。请使用最便宜的模型，并在服务商后台设置消费上限。
  </p>
</div>

<script>
// ==================== 配置区 ====================
const CONFIG = {
  // 你的 API 端点（示例用 OpenAI 兼容格式）
  apiUrl: 'https://api.openai.com/v1/chat/completions',
  apiKey: 'sk-你的key',          // ← 填你的 key
  model: 'gpt-4o-mini',          // ← 用最便宜的！

  // 计费（美元 / 1M tokens），按你实际模型改
  priceInput: 0.15,
  priceOutput: 0.60,

  // 每次请求让模型输出多少 token（越大越烧）
  maxTokens: 200,

  // 并发数（同时发几个请求，别太大，容易被限流）
  concurrency: 3,

  // 每次请求之间的间隔（毫秒），越小烧得越快
  intervalMs: 300,

  // 让模型重复的“废话提示词”，越长输入越贵
  prompt: '请用至少200字详细描述火焰的颜色、温度、形状和哲学意义。',
};
// ==============================================

let state = {
  running: false,
  tokens: 0,
  cost: 0,
  calls: 0,
  recentTokens: [], // 用于计算速率
};

const $ = id => document.getElementById(id);

function log(msg, cls = '') {
  const el = document.createElement('div');
  el.className = cls;
  el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  const box = $('log');
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  while (box.children.length > 100) box.removeChild(box.firstChild);
}

function updateUI() {
  $('tokens').textContent = state.tokens.toLocaleString();
  $('cost').textContent = '$' + state.cost.toFixed(4);
  $('calls').textContent = state.calls.toLocaleString();

  // 计算最近 5 秒的速率
  const now = Date.now();
  state.recentTokens = state.recentTokens.filter(t => now - t.time < 5000);
  const rate = state.recentTokens.reduce((s, t) => s + t.count, 0) / 5;
  $('rate').textContent = Math.round(rate).toLocaleString();
}

async function burnOnce() {
  if (!state.running) return;

  try {
    const res = await fetch(CONFIG.apiUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${CONFIG.apiKey}`,
      },
      body: JSON.stringify({
        model: CONFIG.model,
        messages: [{ role: 'user', content: CONFIG.prompt }],
        max_tokens: CONFIG.maxTokens,
      }),
    });

    const data = await res.json();

    if (data.error) {
      log(`❌ ${data.error.message}`, 'err');
      // 遇到错误自动停，避免疯狂重试
      stop();
      return;
    }

    const usage = data.usage || {};
    const inTok = usage.prompt_tokens || 0;
    const outTok = usage.completion_tokens || 0;
    const total = usage.total_tokens || (inTok + outTok);

    const cost = (inTok / 1e6) * CONFIG.priceInput
               + (outTok / 1e6) * CONFIG.priceOutput;

    state.tokens += total;
    state.cost += cost;
    state.calls += 1;
    state.recentTokens.push({ time: Date.now(), count: total });

    log(`✅ +${total} tokens (in:${inTok} out:${outTok}) $${cost.toFixed(5)}`, 'ok');
    updateUI();
  } catch (e) {
    log(`❌ ${e.message}`, 'err');
    stop();
  }
}

function loop() {
  if (!state.running) return;
  // 并发发射
  for (let i = 0; i < CONFIG.concurrency; i++) {
    burnOnce();
  }
  setTimeout(loop, CONFIG.intervalMs);
}

function start() {
  if (!CONFIG.apiKey || CONFIG.apiKey.includes('你的key')) {
    alert('请先在代码里填入你的 API Key！');
    return;
  }
  state.running = true;
  $('toggle').textContent = '⏸ 停止焚烧';
  $('toggle').classList.add('active');
  $('fire').classList.add('on');
  log('🔥 焚烧开始！', 'ok');
  loop();
}

function stop() {
  state.running = false;
  $('toggle').textContent = '▶ 激活焚烧';
  $('toggle').classList.remove('active');
  $('fire').classList.remove('on');
  log('🛑 焚烧停止');
}

$('toggle').onclick = () => state.running ? stop() : start();

$('reset').onclick = () => {
  stop();
  state = { running: false, tokens: 0, cost: 0, calls: 0, recentTokens: [] };
  $('log').innerHTML = '';
  updateUI();
};

updateUI();
</script>
</body>
</html>
